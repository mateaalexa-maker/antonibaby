
name: Antoni Baby - GitHub Pages cjenici

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Pripremi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Pripremi samo cjenike i arhivu
        run: |
          mkdir -p _site
          cp -r pricelists/. _site/
          touch _site/.nojekyll

      - name: Pripremi datoteke za objavu
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Objavi na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
